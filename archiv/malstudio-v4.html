<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sommer am Meer – Malstudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#073B4C; --sea:#118AB2; --foam:#E9F7FC; --sand:#FFD166;
    --coral:#FF6B5B; --kelp:#06D6A0; --ghost:#C6E6F1; --paper:#FFFFFF;
    --font:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    font-family:var(--font);color:var(--deep);
    background:radial-gradient(120% 70% at 50% 0%,#FFFFFF 0%,var(--foam) 45%,#CFEAF5 100%);
    display:flex;justify-content:center;overscroll-behavior:none;
  }
  .app{width:100%;max-width:1300px;height:100%;padding:10px;display:flex;flex-direction:column;gap:9px}
  h1{font-size:clamp(18px,3vw,26px);font-weight:800;margin:0;letter-spacing:-.4px}
  h1 span{color:var(--sea)}
  section[hidden]{display:none!important}
  .row{display:flex;align-items:center;gap:9px}
  .hint{margin:0;font-weight:500;opacity:.75;font-size:15px}

  .icon-btn{
    height:40px;padding:0 12px;border-radius:13px;border:3px solid var(--deep);
    background:var(--paper);color:var(--deep);font-family:var(--font);font-weight:700;font-size:14px;
    cursor:pointer;box-shadow:0 3px 0 var(--deep);white-space:nowrap;
  }
  .icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--deep)}
  .icon-btn.go{background:var(--kelp)}

  /* ---------- Profile ---------- */
  #profiles{display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}
  .plist{
    flex:1;min-height:0;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start;padding:4px 2px;
  }
  .pcard{
    background:var(--paper);border:3px solid var(--deep);border-radius:20px;box-shadow:0 4px 0 var(--deep);
    padding:16px 8px;cursor:pointer;font-family:var(--font);font-weight:700;font-size:17px;color:var(--deep);
    display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;
  }
  .pcard em{font-size:44px;font-style:normal;line-height:1}
  .pcard small{font-weight:500;font-size:12px;opacity:.6}
  .pcard .x{
    position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
    border:2px solid var(--deep);background:var(--paper);font-size:13px;font-weight:800;
    cursor:pointer;padding:0;line-height:1;
  }
  .pcard.new{border-style:dashed;box-shadow:none;background:transparent}
  .maker{background:var(--paper);border:3px solid var(--deep);border-radius:20px;padding:12px;box-shadow:0 4px 0 var(--deep)}
  .maker input{
    font-family:var(--font);font-size:18px;font-weight:700;color:var(--deep);
    border:3px solid var(--ghost);border-radius:12px;padding:8px 12px;width:190px;outline:none;
  }
  .maker input:focus{border-color:var(--sea)}
  .avatars{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
  .av{
    width:44px;height:44px;border-radius:14px;border:3px solid var(--ghost);background:var(--paper);
    font-size:24px;cursor:pointer;padding:0;line-height:1;
  }
  .av[aria-pressed="true"]{border-color:var(--coral);background:#FFF1EF;transform:scale(1.08)}

  /* ---------- Motivauswahl ---------- */
  #home{display:flex;flex-direction:column;gap:8px;height:100%;min-height:0}
  .chip{
    display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:20px;
    border:3px solid var(--sea);background:var(--paper);font-family:var(--font);font-weight:700;
    font-size:15px;color:var(--deep);cursor:pointer;
  }
  .picker{
    flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));
    gap:9px;align-content:start;padding:4px 2px 8px;
  }
  .tile{
    background:var(--paper);border:3px solid var(--deep);border-radius:18px;
    box-shadow:0 4px 0 var(--deep);padding:11px 6px;cursor:pointer;
    font-family:var(--font);font-weight:700;font-size:14px;color:var(--deep);
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .tile em{font-size:32px;font-style:normal;line-height:1}
  .tile b{font-weight:700;font-size:11px;letter-spacing:.5px;color:var(--sea)}
  .tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}

  /* ---------- Galerie ---------- */
  #gallery{display:flex;flex-direction:column;gap:9px;height:100%;min-height:0}
  .gal{
    flex:1;min-height:0;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;align-content:start;padding:4px 2px;
  }
  .pic{
    position:relative;background:var(--paper);border:3px solid var(--deep);border-radius:18px;
    box-shadow:0 4px 0 var(--deep);overflow:hidden;
  }
  .pic img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
  .pic .cap{padding:6px 10px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:6px}
  .pic .cap small{font-weight:500;opacity:.6}
  .pic .x{
    position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:50%;
    border:3px solid var(--deep);background:var(--paper);font-size:14px;font-weight:800;cursor:pointer;padding:0;
  }
  .pic .x.armed{background:var(--coral);color:#fff;width:auto;padding:0 10px;border-radius:15px}
  .empty{opacity:.6;font-weight:600;padding:20px 4px}

  /* ---------- Malansicht ---------- */
  #draw{display:flex;flex-direction:column;gap:9px;height:100%;min-height:0}
  .bubbles{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .bub{
    width:27px;height:27px;border-radius:50%;border:3px solid var(--ghost);
    background:var(--paper);color:var(--sea);font-family:var(--font);font-weight:700;font-size:13px;
    display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .2s,background .2s,border-color .2s,color .2s;
  }
  .bub.done{background:var(--kelp);border-color:var(--kelp);color:#fff}
  .bub.now{background:var(--coral);border-color:var(--coral);color:#fff;transform:translateY(-3px) scale(1.15)}

  .task{
    background:var(--paper);border:3px solid var(--deep);border-radius:16px;
    padding:7px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 var(--deep);flex:none;
  }
  .task .emoji{font-size:28px;line-height:1}
  .task h2{margin:0;font-size:clamp(15px,2.2vw,20px);font-weight:800}
  .task p{margin:1px 0 0;font-size:clamp(13px,1.9vw,16px);font-weight:500;opacity:.8}

  .done-bar{
    display:none;align-items:center;gap:8px;flex-wrap:wrap;
    background:var(--kelp);border:3px solid var(--deep);border-radius:16px;
    padding:7px 10px;box-shadow:0 4px 0 var(--deep);
  }
  .done-bar.on{display:flex}
  .done-bar strong{font-size:16px}
  .done-bar .icon-btn{height:36px;font-size:14px}

  .stage{flex:1;min-height:0;display:flex;gap:10px}

  .ref{width:250px;flex:none;display:flex;flex-direction:column;gap:6px;min-height:0}
  .ref-label{font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--sea);padding-left:4px}
  .ref-frame{
    position:relative;background:var(--paper);border:3px solid var(--sea);
    border-radius:18px;box-shadow:0 5px 0 var(--sea);aspect-ratio:4/3;overflow:hidden;flex:none;
  }
  .ref-frame svg{position:absolute;inset:0;width:100%;height:100%}
  .ref-note{font-size:13px;font-weight:500;opacity:.75;line-height:1.25;padding:0 4px}
  #ref g path,#ref g circle{fill:none;stroke:var(--ghost);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  #ref g.done path,#ref g.done circle{stroke:var(--deep)}
  #ref g.now path,#ref g.now circle{stroke:var(--coral);stroke-width:10;stroke-dasharray:100}
  #ref g.now.draw path,#ref g.now.draw circle{animation:trace 1.2s ease forwards}
  @keyframes trace{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}

  .board{
    flex:1;min-width:0;min-height:0;display:grid;place-items:center;
    background:var(--foam);border:3px solid var(--deep);border-radius:20px;
    box-shadow:0 5px 0 var(--deep);overflow:hidden;padding:6px;
  }
  .board.party{animation:party 1.6s ease 2}
  @keyframes party{
    0%,100%{border-color:var(--deep);box-shadow:0 5px 0 var(--deep)}
    50%{border-color:var(--kelp);box-shadow:0 5px 0 var(--kelp),0 0 0 8px rgba(6,214,160,.25)}
  }
  .sheet{
    position:relative;width:100%;height:100%;
    background:var(--paper);border-radius:12px;overflow:hidden;touch-action:none;
    box-shadow:0 0 0 2px rgba(7,59,76,.12);
  }
  .sheet canvas,.sheet svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  #ghost{opacity:0;transition:opacity .3s;pointer-events:none;z-index:2}
  .sheet canvas{z-index:1}
  #ghost.on{opacity:.55}
  #ghost path,#ghost circle{fill:none;stroke:var(--sea);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  #ghost g{display:none}
  #ghost g.show{display:block}
  @media (prefers-reduced-motion:reduce){
    #ref g.now.draw path,#ref g.now.draw circle{animation:none}
    .bub{transition:none}.board.party{animation:none}
  }

  .side{width:232px;flex:none;display:flex;flex-direction:column;gap:7px}
  .tools3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .tool{
    height:44px;border-radius:13px;border:3px solid var(--deep);background:var(--paper);
    font-family:var(--font);font-weight:700;font-size:20px;cursor:pointer;box-shadow:0 3px 0 var(--deep);padding:0;
  }
  .tool[aria-pressed="true"]{background:var(--sand)}
  .tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--deep)}
  .colors{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;justify-items:center}
  .swatch{
    width:35px;height:35px;border-radius:50%;border:3px solid var(--paper);
    box-shadow:0 0 0 3px var(--deep);cursor:pointer;padding:0;transition:transform .15s;
  }
  .swatch[aria-pressed="true"]{transform:scale(1.22)}
  .sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .size{
    height:40px;border-radius:13px;border:3px solid var(--deep);background:var(--paper);
    cursor:pointer;padding:0;display:grid;place-items:center;box-shadow:0 3px 0 var(--deep);
  }
  .size i{display:block;border-radius:50%;background:var(--deep)}
  .size[aria-pressed="true"]{background:var(--sand)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .nav-btn{
    height:52px;border-radius:16px;border:3px solid var(--deep);
    font-family:var(--font);font-weight:800;font-size:17px;
    background:var(--sand);color:var(--deep);cursor:pointer;box-shadow:0 4px 0 var(--deep);
  }
  .nav-btn.primary{background:var(--kelp)}
  .nav-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
  .nav-btn:disabled{opacity:.35;transform:none;cursor:default}
  .spacer{flex:1}

  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
    background:var(--deep);color:#fff;font-weight:700;font-size:15px;
    padding:10px 18px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (orientation:portrait){
    .stage{flex-wrap:wrap}
    .ref{width:190px}
    .ref-note{display:none}
    .side{width:100%;order:3;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center}
    .colors{grid-template-columns:repeat(8,auto)}
    .sizes,.tools3{grid-template-columns:repeat(4,54px)}
    .grid2{grid-template-columns:repeat(4,auto)}
    .side .nav-btn{flex:1;min-width:130px;height:48px}
    .spacer{display:none}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ PROFILE ============ -->
  <section id="profiles">
    <h1>Wer malt <span>heute</span>?</h1>
    <div class="plist" id="plist"></div>
    <div class="maker" id="maker" hidden>
      <div class="row">
        <input id="pname" type="text" placeholder="Name" maxlength="14" autocomplete="off">
        <button class="icon-btn go" id="pcreate">Fertig</button>
        <button class="icon-btn" id="pcancel">Abbrechen</button>
      </div>
      <div class="avatars" id="avatars"></div>
    </div>
  </section>

  <!-- ============ MOTIVE ============ -->
  <section id="home" hidden>
    <div class="row">
      <button class="chip" id="profileChip"></button>
      <h1>Was malen wir <span>heute</span>?</h1>
      <button class="icon-btn" id="galBtn" style="margin-left:auto">🖼️ Galerie</button>
    </div>
    <p class="hint">Links steht die Vorlage – im weißen Feld malst du sie nach.</p>
    <div class="picker" id="picker"></div>
  </section>

  <!-- ============ GALERIE ============ -->
  <section id="gallery" hidden>
    <div class="row">
      <button class="icon-btn" id="galBack">◀︎ Zurück</button>
      <h1 id="galTitle">Galerie</h1>
    </div>
    <div class="gal" id="galGrid"></div>
  </section>

  <!-- ============ MALEN ============ -->
  <section id="draw" hidden>
    <div class="row">
      <button class="icon-btn" id="home-btn">◀︎ Motive</button>
      <h1 id="motifName"></h1>
      <div class="bubbles" id="bubbles"></div>
    </div>

    <div class="task">
      <div class="emoji" id="taskEmoji">✏️</div>
      <div>
        <h2 id="taskTitle"></h2>
        <p id="taskText"></p>
      </div>
    </div>

    <div class="done-bar" id="doneBar">
      <strong>🎉 Fertig!</strong>
      <button class="icon-btn go" id="toGallery">🖼️ In die Galerie</button>
      <button class="icon-btn" id="saveDone">💾 Speichern</button>
      <button class="icon-btn" id="again">↻ Noch einmal</button>
      <button class="icon-btn" id="other">🎨 Anderes Motiv</button>
    </div>

    <div class="stage">
      <aside class="ref">
        <div class="ref-label">Vorlage</div>
        <div class="ref-frame"><svg id="ref" viewBox="0 0 800 600" aria-hidden="true"></svg></div>
        <p class="ref-note">Rot ist der Strich, der jetzt dran ist. Male ihn rechts nach.</p>
      </aside>

      <div class="board" id="board">
        <div class="sheet" id="sheet">
          <svg id="ghost" viewBox="0 0 800 600" aria-hidden="true"></svg>
          <canvas id="pad"></canvas>
        </div>
      </div>

      <div class="side">
        <div class="tools3" id="tools3">
          <button class="tool" id="tPen"   aria-pressed="true"  title="Stift">✏️</button>
          <button class="tool" id="tFill"  aria-pressed="false" title="Farbeimer">🪣</button>
          <button class="tool" id="tErase" aria-pressed="false" title="Radiergummi">🧽</button>
        </div>
        <div class="colors" id="colors"></div>
        <div class="sizes" id="sizes"></div>
        <div class="grid2">
          <button class="icon-btn" id="undo">↩︎ Zurück</button>
          <button class="icon-btn" id="clear">🗑️ Alles</button>
          <button class="icon-btn" id="helper">🫥 Hilfslinien</button>
          <button class="icon-btn" id="musicBtn">🎵 Musik</button>
        </div>
        <button class="icon-btn go" id="keep">🖼️ In die Galerie</button>
        <div class="spacer"></div>
        <button class="nav-btn" id="back">◀︎ Schritt zurück</button>
        <button class="nav-btn primary" id="next">Weiter ▶︎</button>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

/* ============================================================
   SPEICHER – nutzt window.storage, sonst localStorage
   ============================================================ */
const Store=(function(){
  const api = (typeof window!=='undefined' && window.storage && window.storage.get) ? window.storage : null;
  const mem = {};
  return {
    async get(k){
      try{
        if(api){ const r=await api.get(k,false); return r?r.value:null; }
        return localStorage.getItem(k);
      }catch(e){ return (k in mem)?mem[k]:null; }
    },
    async set(k,v){
      try{ if(api){ await api.set(k,v,false); } else { localStorage.setItem(k,v); } }
      catch(e){ mem[k]=v; }
    },
    async del(k){
      try{ if(api){ await api.delete(k,false); } else { localStorage.removeItem(k); } }
      catch(e){ delete mem[k]; }
    },
    async keys(prefix){
      try{
        if(api){ const r=await api.list(prefix,false); return r&&r.keys?r.keys:[]; }
        return Object.keys(localStorage).filter(k=>k.indexOf(prefix)===0);
      }catch(e){ return Object.keys(mem).filter(k=>k.indexOf(prefix)===0); }
    }
  };
})();

/* ============================================================
   MUSIK
   ============================================================ */
const Music=(function(){
  let ac=null,master=null,timer=null,noiseBuf=null,bar=0,slot=0,nextTime=0,on=true;
  const EIGHTH=60/88/2,LOOK=0.15;
  const CHORDS=[{bass:41,notes:[57,60,64]},{bass:38,notes:[57,60,65]},
                {bass:43,notes:[58,62,65]},{bass:36,notes:[58,64,67]}];
  const MELODY=[72,74,77,69,81,76];
  const f=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ac) return;
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain(); master.gain.value=0.085; master.connect(ac.destination);
    const len=ac.sampleRate*2;
    noiseBuf=ac.createBuffer(1,len,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const surf=ac.createBufferSource(); surf.buffer=noiseBuf; surf.loop=true;
    const sf=ac.createBiquadFilter(); sf.type='lowpass'; sf.frequency.value=420;
    const sg=ac.createGain(); sg.gain.value=0.02;
    const lfo=ac.createOscillator(); lfo.frequency.value=0.13;
    const lg=ac.createGain(); lg.gain.value=0.012;
    lfo.connect(lg); lg.connect(sg.gain);
    surf.connect(sf); sf.connect(sg); sg.connect(master);
    surf.start(); lfo.start();
  }
  function pluck(t,freq,dur,vol,type,cut){
    const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();
    o.type=type||'triangle'; o.frequency.value=freq;
    fl.type='lowpass'; fl.frequency.value=cut||2200;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(fl); fl.connect(g); g.connect(master);
    o.start(t); o.stop(t+dur+0.05);
  }
  function shaker(t,vol){
    const s=ac.createBufferSource(); s.buffer=noiseBuf;
    const fl=ac.createBiquadFilter(); fl.type='highpass'; fl.frequency.value=6000;
    const g=ac.createGain();
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    s.connect(fl); fl.connect(g); g.connect(master);
    s.start(t); s.stop(t+0.1);
  }
  function tick(){
    while(nextTime<ac.currentTime+LOOK){
      const ch=CHORDS[bar%CHORDS.length],t=nextTime;
      if(slot===0) pluck(t,f(ch.bass),0.9,0.16,'sine',600);
      if(slot===4) pluck(t,f(ch.bass+7),0.8,0.12,'sine',600);
      if(slot===0||slot===3||slot===6){
        const v=slot===0?0.075:0.055;
        ch.notes.forEach((n,i)=>pluck(t+i*0.012,f(n),0.75,v,'triangle',1800));
      }
      shaker(t, slot%2?0.018:0.030);
      if(bar%2===1 && slot===2 && Math.random()<0.7)
        pluck(t,f(MELODY[Math.floor(Math.random()*MELODY.length)]),1.1,0.05,'sine',3000);
      nextTime+=EIGHTH;
      if(++slot>7){slot=0;bar++;}
    }
  }
  return {
    start(){ if(!on) return; init(); if(ac.state==='suspended') ac.resume();
      if(timer) return; nextTime=ac.currentTime+0.1; slot=0; timer=setInterval(tick,25); },
    stop(){ if(timer){clearInterval(timer);timer=null;} },
    toggle(){ on=!on; on?this.start():this.stop(); return on; }
  };
})();

const art=document.createElement('canvas'); art.width=1200; art.height=900;
const actx=art.getContext('2d',{willReadFrequently:true});
let undoStack=[];

function clearArt(){ actx.fillStyle=PAPER; actx.fillRect(0,0,art.width,art.height); paint(); }
function paint(){
  ctx.clearRect(0,0,pad.width,pad.height);
  ctx.drawImage(art,0,0,pad.width,pad.height);
}
function snapshot(){
  try{ undoStack.push(art.toDataURL('image/png')); if(undoStack.length>12) undoStack.shift(); }catch(e){}
}
function undo(){
  const d=undoStack.pop(); if(!d) return;
  const img=new Image();
  img.onload=()=>{ actx.fillStyle=PAPER; actx.fillRect(0,0,art.width,art.height); actx.drawImage(img,0,0); paint(); };
  img.src=d;
}
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('on'),1800);
}

/* ---------- Profile ---------- */
async function loadProfiles(){
  const raw=await Store.get('profiles');
  try{ profiles=raw?JSON.parse(raw):[]; }catch(e){ profiles=[]; }
}
async function saveProfiles(){ await Store.set('profiles',JSON.stringify(profiles)); }

function renderProfiles(){
  const list=$('plist'); list.textContent='';
  profiles.forEach(p=>{
    const c=document.createElement('button');
    c.className='pcard';
    c.innerHTML='<em>'+p.emoji+'</em>'+p.name+'<small>'+(p.count||0)+' Bilder</small>';
    c.addEventListener('click',e=>{ if(e.target.classList.contains('x')) return; pickProfile(p); });
    const x=document.createElement('button');
    x.className='x'; x.textContent='✕'; x.title='Profil löschen';
    x.addEventListener('click',async e=>{
      e.stopPropagation();
      if(x.dataset.armed){
        const ks=await Store.keys('pic:'+p.id+':');
        for(const k of ks) await Store.del(k);
        profiles=profiles.filter(q=>q.id!==p.id);
        await saveProfiles(); renderProfiles();
      }else{ x.dataset.armed='1'; x.textContent='?'; setTimeout(()=>{x.dataset.armed='';x.textContent='✕';},2500); }
    });
    c.appendChild(x);
    list.appendChild(c);
  });
  const add=document.createElement('button');
  add.className='pcard new';
  add.innerHTML='<em>＋</em>Neues Kind';
  add.addEventListener('click',()=>{ $('maker').hidden=false; $('pname').focus(); });
  list.appendChild(add);
}

function shapeEl(sh){
  let el;
  if(Array.isArray(sh)){
    el=document.createElementNS(NS,'circle');
    el.setAttribute('cx',sh[0]); el.setAttribute('cy',sh[1]); el.setAttribute('r',sh[2]);
  }else{
    el=document.createElementNS(NS,'path'); el.setAttribute('d',sh);
  }
  el.setAttribute('pathLength','100');
  return el;
}
function buildArt(){
  ref.textContent=''; ghost.textContent='';
  motif.steps.forEach(st=>{
    const g1=document.createElementNS(NS,'g'), g2=document.createElementNS(NS,'g');
    st.shapes.forEach(sh=>{ g1.appendChild(shapeEl(sh)); g2.appendChild(shapeEl(sh)); });
    ref.appendChild(g1); ghost.appendChild(g2);
  });
}

    bubbles.appendChild(b);
  });
}
function openMotif(i){
  motif=MOTIFS[i];
  $('motifName').textContent=motif.emoji+' '+motif.name;
  buildArt(); buildBubbles();
  undoStack=[];
  doneBar.classList.remove('on'); $('board').classList.remove('party');
  ghost.classList.remove('on'); helper.textContent='🫥 Hilfslinien';
  showSection(secDraw);
  Music.start();
  requestAnimationFrame(()=>{ layout(); clearArt(); show(0); });
}
$('home-btn').addEventListener('click',()=>showSection(secHome));
$('other').addEventListener('click',()=>showSection(secHome));

function show(i){
  step=i;
  const s=motif.steps[i];
  $('taskEmoji').textContent=s.emoji;
  $('taskTitle').textContent='Schritt '+(i+1)+': '+s.title;
  $('taskText').textContent=s.text;
  [...ref.children].forEach((g,n)=>{
    g.classList.remove('done','now','draw');
    [...g.children].forEach(el=>el.style.animationDelay='');
    if(n<i) g.classList.add('done');
    if(n===i){
      g.classList.add('now');
      [...g.children].forEach((el,k)=>el.style.animationDelay=(k*0.3)+'s');
      void g.getBoundingClientRect();
      g.classList.add('draw');
    }
  });
  [...ghost.children].forEach((g,n)=>g.classList.toggle('show',n<=i));
  [...bubbles.children].forEach((b,n)=>{
    b.classList.toggle('done',n<i);
    b.classList.toggle('now',n===i);
  });
  $('back').disabled=i===0;
  $('next').textContent = i===motif.steps.length-1 ? 'Fertig! 🎉' : 'Weiter ▶︎';
}
$('back').addEventListener('click',()=>{ doneBar.classList.remove('on'); if(step>0) show(step-1); });
$('next').addEventListener('click',()=>{
  if(step<motif.steps.length-1){ doneBar.classList.remove('on'); show(step+1); }
  else finish();
});
function finish(){
  ghost.classList.remove('on'); helper.textContent='🫥 Hilfslinien';
  const b=$('board'); b.classList.remove('party'); void b.offsetWidth; b.classList.add('party');
  doneBar.classList.add('on');
  [...ref.children].forEach(g=>{g.classList.remove('now','draw');g.classList.add('done');});
  [...bubbles.children].forEach(x=>{x.classList.remove('now');x.classList.add('done');});
}
$('again').addEventListener('click',()=>{
  doneBar.classList.remove('on'); $('board').classList.remove('party');
  undoStack=[]; clearArt(); show(0);
});

/* ---------- Werkzeuge ---------- */

Object.keys(tools).forEach(k=>{

const colorsBox=$('colors');
COLORS.forEach((c,i)=>{

const sizesBox=$('sizes');
SIZES.forEach((s,i)=>{

/* ---------- Zeichnen ---------- */
function resize(){
  const r=pad.getBoundingClientRect();
  if(!r.width||!r.height) return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  pad.width=Math.round(r.width*dpr); pad.height=Math.round(r.height*dpr);
  paint();
}
function artPos(e){
  const r=pad.getBoundingClientRect();
  return { x:Math.round((e.clientX-r.left)/r.width*art.width),
           y:Math.round((e.clientY-r.top)/r.height*art.height) };
}
let drawing=false, last=null;
pad.addEventListener('pointerdown',e=>{
  const p=artPos(e);
  snapshot();
  if(tool==='fill'){ floodFill(p.x,p.y,color); paint(); return; }
  drawing=true; last=p;
  pad.setPointerCapture(e.pointerId);
  actx.strokeStyle = tool==='erase'?PAPER:color;
  actx.fillStyle   = actx.strokeStyle;
  actx.lineWidth   = width*art.height;
  actx.lineCap='round'; actx.lineJoin='round';
  actx.beginPath();
  actx.arc(p.x,p.y,actx.lineWidth/2,0,Math.PI*2); actx.fill();
  paint();
});
pad.addEventListener('pointermove',e=>{
  if(!drawing) return;
  const p=artPos(e);
  actx.beginPath(); actx.moveTo(last.x,last.y); actx.lineTo(p.x,p.y); actx.stroke();
  last=p; paint();
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>
  pad.addEventListener(ev,()=>{ drawing=false; }));

function hexToInt(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (255<<24)|(b<<16)|(g<<8)|r;
}
function floodFill(sx,sy,hex){
  const w=art.width,h=art.height;
  if(sx<0||sy<0||sx>=w||sy>=h) return;
  const img=actx.getImageData(0,0,w,h);
  const d=new Uint32Array(img.data.buffer);
  const start=sy*w+sx, target=d[start], fill=hexToInt(hex);
  const tr=target&255, tg=(target>>8)&255, tb=(target>>16)&255;
  const fr=fill&255, fg=(fill>>8)&255, fb=(fill>>16)&255;
  const tol=42;
  if(Math.abs(fr-tr)<=tol && Math.abs(fg-tg)<=tol && Math.abs(fb-tb)<=tol) return;
  const match=c=>Math.abs((c&255)-tr)<=tol && Math.abs(((c>>8)&255)-tg)<=tol && Math.abs(((c>>16)&255)-tb)<=tol;
  const stack=[start];
  while(stack.length){
    const i=stack.pop();
    if(!match(d[i])) continue;
    let left=i, right=i;
    while(left%w>0 && match(d[left-1])) left--;
    while(right%w<w-1 && match(d[right+1])) right++;
    for(let p=left;p<=right;p++){
      d[p]=fill;
      if(p-w>=0 && match(d[p-w])) stack.push(p-w);
      if(p+w<d.length && match(d[p+w])) stack.push(p+w);
    }
  }
  actx.putImageData(img,0,0);
}

$('undo').addEventListener('click',undo);
$('clear').addEventListener('click',()=>{ snapshot(); clearArt(); });
helper.addEventListener('click',()=>{
  const on=ghost.classList.toggle('on');
  helper.textContent = on ? '🫥 Hilfslinien aus' : '🫥 Hilfslinien';
});
$('musicBtn').addEventListener('click',e=>{ e.target.textContent = Music.toggle() ? '🎵 Musik' : '🔇 Musik aus'; });

function download(){
  const a=document.createElement('a');
  a.download=(motif?motif.name:'bild')+'.png'; a.href=art.toDataURL('image/png'); a.click();
}

/* ---------- Galerie ---------- */
function thumb(){
  const c=document.createElement('canvas'); c.width=640; c.height=480;
  const o=c.getContext('2d');
  o.fillStyle=PAPER; o.fillRect(0,0,c.width,c.height);
  o.drawImage(art,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.82);
}
async function keepPicture(){
  if(!profile) return;
  const key='pic:'+profile.id+':'+Date.now();
  await Store.set(key, JSON.stringify({motif:motif?motif.name:'Bild', emoji:motif?motif.emoji:'🎨', img:thumb()}));
  const ks=await Store.keys('pic:'+profile.id+':');
  if(ks.length>40){ ks.sort(); for(const k of ks.slice(0,ks.length-40)) await Store.del(k); }
  profile.count=(await Store.keys('pic:'+profile.id+':')).length;
  await saveProfiles();
  toast('🖼️ Bild in der Galerie gespeichert');
}
$('keep').addEventListener('click',keepPicture);
$('toGallery').addEventListener('click',async()=>{ await keepPicture(); openGallery(); });
$('galBtn').addEventListener('click',openGallery);
$('galBack').addEventListener('click',()=>showSection(secHome));

async function openGallery(){
  showSection(secGallery);
  const grid=$('galGrid'); grid.textContent='';
  $('galTitle').textContent='Galerie von '+(profile?profile.name:'');
  const ks=(await Store.keys('pic:'+profile.id+':')).sort().reverse();
  if(!ks.length){ grid.innerHTML='<p class="empty">Noch keine Bilder. Male eins und tippe auf „In die Galerie".</p>'; return; }
  for(const k of ks){
    let rec; try{ rec=JSON.parse(await Store.get(k)); }catch(e){ continue; }
    if(!rec) continue;
    const card=document.createElement('div'); card.className='pic';
    const im=document.createElement('img'); im.src=rec.img; im.alt=rec.motif;
    const cap=document.createElement('div'); cap.className='cap';
    const when=new Date(Number(k.split(':')[2])||Date.now());
    cap.innerHTML='<span>'+(rec.emoji||'')+' '+rec.motif+'</span><small>'+when.toLocaleDateString('de-DE')+'</small>';
    const x=document.createElement('button'); x.className='x'; x.textContent='✕';
    x.addEventListener('click',async()=>{
      if(x.classList.contains('armed')){
        await Store.del(k);
        profile.count=(await Store.keys('pic:'+profile.id+':')).length;
        await saveProfiles(); openGallery();
      }else{
        x.classList.add('armed'); x.textContent='Löschen?';
        setTimeout(()=>{x.classList.remove('armed');x.textContent='✕';},2600);
      }
    });
    card.appendChild(im); card.appendChild(cap); card.appendChild(x);
    grid.appendChild(card);
  }
}

/* ---------- Start ---------- */
function layout(){
  const c=$('board'); if(!c) return;
  const r=c.getBoundingClientRect();
  if(r.width<40||r.height<30) return;
  const w=r.width-14,h=r.height-14;
  let sw=w,sh=w*3/4;
  if(sh>h){ sh=h; sw=h*4/3; }
  sheet.style.width=Math.floor(sw)+'px'; sheet.style.height=Math.floor(sh)+'px';
  resize();
}
if(window.ResizeObserver) new ResizeObserver(layout).observe($('board'));
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',()=>setTimeout(layout,300));
layout();

(async function(){
  await loadProfiles();
  for(const p of profiles){ p.count=(await Store.keys('pic:'+p.id+':')).length; }
  renderProfiles();
  const last=await Store.get('lastProfile');
  const found=profiles.find(p=>p.id===last);
  if(found) pickProfile(found); else showSection(secProfiles);
})();
})();
