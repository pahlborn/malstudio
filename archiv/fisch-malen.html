<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fisch malen – Schritt für Schritt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#073B4C;
    --sea:#118AB2;
    --foam:#E9F7FC;
    --sand:#FFD166;
    --coral:#FF6B5B;
    --kelp:#06D6A0;
    --ghost:#C6E6F1;
    --paper:#FFFFFF;
    --font:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--font);
    color:var(--deep);
    background:
      radial-gradient(120% 70% at 50% 0%, #FFFFFF 0%, var(--foam) 45%, #CFEAF5 100%);
    display:flex;
    justify-content:center;
    overscroll-behavior:none;
  }
  .app{
    width:100%;
    max-width:820px;
    padding:14px 14px 22px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  /* ---------- Kopf: Schrittkette als aufsteigende Blasen ---------- */
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{
    font-size:clamp(22px,6vw,32px);
    font-weight:800;
    margin:0;
    letter-spacing:-.5px;
  }
  h1 span{color:var(--sea)}
  .bubbles{display:flex;gap:8px;margin-left:auto}
  .bub{
    width:30px;height:30px;border-radius:50%;
    border:3px solid var(--ghost);
    background:var(--paper);
    color:var(--sea);
    font-family:var(--font);font-weight:700;font-size:14px;
    display:grid;place-items:center;
    cursor:pointer;padding:0;
    transition:transform .2s, background .2s, border-color .2s, color .2s;
  }
  .bub.done{background:var(--kelp);border-color:var(--kelp);color:#fff}
  .bub.now{background:var(--coral);border-color:var(--coral);color:#fff;transform:translateY(-4px) scale(1.15)}
  .bub:focus-visible{outline:3px solid var(--deep);outline-offset:2px}

  /* ---------- Anweisung ---------- */
  .task{
    background:var(--paper);
    border:3px solid var(--deep);
    border-radius:18px;
    padding:12px 16px;
    display:flex;align-items:center;gap:14px;
    box-shadow:0 5px 0 var(--deep);
  }
  .task .emoji{font-size:34px;line-height:1}
  .task h2{margin:0;font-size:clamp(18px,4.6vw,24px);font-weight:800}
  .task p{margin:2px 0 0;font-size:clamp(14px,3.6vw,17px);font-weight:500;opacity:.8}

  /* ---------- Zeichenfläche ---------- */
  .board{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    background:var(--paper);
    border:3px solid var(--deep);
    border-radius:22px;
    box-shadow:0 6px 0 var(--deep);
    overflow:hidden;
    touch-action:none;
  }
  .board svg,.board canvas{position:absolute;inset:0;width:100%;height:100%}
  .board canvas{cursor:crosshair}
  #guide.hidden{opacity:0}
  #guide{transition:opacity .25s}
  #guide [data-step]{display:none}
  #guide [data-step].show{display:block}
  #guide path,#guide circle{
    fill:none;
    stroke:var(--ghost);
    stroke-width:5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  #guide .active path,#guide .active circle{
    stroke:var(--coral);
    stroke-width:7;
    stroke-dasharray:100;
  }
  #guide .active.draw path,#guide .active.draw circle{
    animation:trace 1.4s ease forwards;
  }
  #guide .active.draw *:nth-child(2){animation-delay:.5s}
  #guide .active.draw *:nth-child(3){animation-delay:1s}
  #guide .active.draw *:nth-child(4){animation-delay:1.4s}
  #guide .active.draw *:nth-child(5){animation-delay:1.8s}
  @keyframes trace{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){
    #guide .active.draw path,#guide .active.draw circle{animation:none}
    .bub{transition:none}
  }

  /* ---------- Farben & Werkzeuge ---------- */
  .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .swatch{
    width:44px;height:44px;border-radius:50%;
    border:4px solid var(--paper);
    box-shadow:0 0 0 3px var(--deep);
    cursor:pointer;padding:0;
    transition:transform .15s;
  }
  .swatch[aria-pressed="true"]{transform:scale(1.22)}
  .swatch:focus-visible{outline:3px solid var(--deep);outline-offset:6px}
  .icon-btn{
    height:46px;padding:0 16px;
    border-radius:14px;border:3px solid var(--deep);
    background:var(--paper);color:var(--deep);
    font-family:var(--font);font-weight:700;font-size:16px;
    cursor:pointer;box-shadow:0 4px 0 var(--deep);
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}

  /* ---------- Navigation ---------- */
  nav{display:flex;gap:10px}
  .nav-btn{
    flex:1;height:62px;
    border-radius:18px;border:3px solid var(--deep);
    font-family:var(--font);font-weight:800;font-size:clamp(17px,4.5vw,21px);
    background:var(--sand);color:var(--deep);
    cursor:pointer;box-shadow:0 5px 0 var(--deep);
  }
  .nav-btn.primary{background:var(--kelp);flex:2}
  .nav-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--deep)}
  .nav-btn:disabled{opacity:.35;box-shadow:0 5px 0 var(--deep);transform:none;cursor:default}
  .nav-btn:focus-visible{outline:3px solid var(--sea);outline-offset:3px}

  /* ---------- Jubel ---------- */
  .cheer{
    position:fixed;inset:0;display:none;place-items:center;
    background:rgba(7,59,76,.75);z-index:9;padding:20px;
  }
  .cheer.on{display:grid}
  .cheer-card{
    background:var(--paper);border:4px solid var(--deep);border-radius:26px;
    padding:26px;text-align:center;max-width:340px;box-shadow:0 8px 0 var(--deep);
  }
  .cheer-card p{font-size:20px;font-weight:700;margin:8px 0 18px}
  .cheer-card .big{font-size:64px;margin:0}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Wir malen einen <span>Fisch</span></h1>
    <div class="bubbles" id="bubbles" role="tablist" aria-label="Schritte"></div>
  </header>

  <div class="task">
    <div class="emoji" id="taskEmoji">🐟</div>
    <div>
      <h2 id="taskTitle"></h2>
      <p id="taskText"></p>
    </div>
  </div>

  <div class="board">
    <svg id="guide" viewBox="0 0 800 600" aria-hidden="true">
      <g data-step="1">
        <path d="M180,300 C200,210 340,170 470,230 C510,250 545,275 570,300 C545,325 510,350 470,370 C340,430 200,390 180,300 Z" pathLength="100"/>
      </g>
      <g data-step="2">
        <path d="M182,300 C152,272 122,222 95,214 C106,254 116,286 119,300 C116,314 106,346 95,386 C122,378 152,328 182,300 Z" pathLength="100"/>
      </g>
      <g data-step="3">
        <path d="M296,201 C330,142 392,126 428,148 C421,176 426,196 432,208" pathLength="100"/>
        <path d="M300,399 C312,442 344,458 368,450 C352,434 346,420 343,407" pathLength="100"/>
      </g>
      <g data-step="4">
        <circle cx="486" cy="272" r="20" pathLength="100"/>
        <circle cx="490" cy="274" r="8" pathLength="100"/>
      </g>
      <g data-step="5">
        <path d="M566,306 C550,313 546,324 553,335" pathLength="100"/>
        <path d="M446,238 C424,268 424,332 446,362" pathLength="100"/>
      </g>
      <g data-step="6">
        <path d="M300,268 C316,282 316,318 300,332" pathLength="100"/>
        <path d="M348,258 C366,276 366,324 348,342" pathLength="100"/>
        <path d="M396,254 C416,274 416,326 396,346" pathLength="100"/>
        <circle cx="622" cy="238" r="12" pathLength="100"/>
        <circle cx="662" cy="192" r="8" pathLength="100"/>
      </g>
    </svg>
    <canvas id="pad"></canvas>
  </div>

  <div class="tools" id="tools">
    <button class="icon-btn" id="undo">↩︎ Zurücknehmen</button>
    <button class="icon-btn" id="clear">🧽 Alles weg</button>
    <button class="icon-btn" id="toggleGuide">👀 Vorlage aus</button>
    <button class="icon-btn" id="save">💾 Bild speichern</button>
  </div>

  <nav>
    <button class="nav-btn" id="back">◀︎ Zurück</button>
    <button class="nav-btn primary" id="next">Weiter ▶︎</button>
  </nav>
</div>

<div class="cheer" id="cheer">
  <div class="cheer-card">
    <p class="big">🎉🐠🎉</p>
    <p>Fertig! Dein Fisch schwimmt.</p>
    <button class="nav-btn primary" id="again" style="width:100%">Noch einmal</button>
  </div>
</div>

<script>
(function(){
  const STEPS = [
    {emoji:"🥚", title:"Der Körper", text:"Male ein dickes Ei – vorne spitz, hinten rund."},
    {emoji:"🔱", title:"Der Schwanz", text:"Hinten dran zwei Zipfel wie ein großes V."},
    {emoji:"🪁", title:"Die Flossen", text:"Eine Flosse oben aufs Dach, eine kleine unten an den Bauch."},
    {emoji:"👁️", title:"Das Auge", text:"Ein Kreis vorne – und ein Punkt mitten hinein."},
    {emoji:"😗", title:"Mund und Kiemen", text:"Ein kleines Küsschen vorne, ein Bogen für die Kiemen."},
    {emoji:"🫧", title:"Schuppen und Blubber", text:"Ein paar Bögen als Schuppen und Blasen zum Blubbern."}
  ];

  const COLORS = ["#118AB2","#FF6B5B","#FFD166","#06D6A0","#9B5DE5","#073B4C"];

  const guide   = document.getElementById('guide');
  const bubbles = document.getElementById('bubbles');
  const pad     = document.getElementById('pad');
  const ctx     = pad.getContext('2d');
  const cheer   = document.getElementById('cheer');

  let step = 0;
  let color = COLORS[0];
  let strokes = [];      // Striche in 0..1-Koordinaten, damit sie beim Drehen erhalten bleiben
  let current = null;

  /* ---- Farbfelder ---- */
  const tools = document.getElementById('tools');
  COLORS.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className = 'swatch';
    b.style.background = c;
    b.setAttribute('aria-label','Farbe '+(i+1));
    b.setAttribute('aria-pressed', i===0 ? 'true':'false');
    b.addEventListener('click',()=>{
      color = c;
      tools.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
    });
    tools.insertBefore(b, tools.firstChild);
  });

  /* ---- Schrittblasen ---- */
  STEPS.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className='bub'; b.textContent=i+1;
    b.setAttribute('aria-label','Schritt '+(i+1)+': '+s.title);
    b.addEventListener('click',()=>show(i));
    bubbles.appendChild(b);
  });

  function show(i){
    step = i;
    const s = STEPS[i];
    document.getElementById('taskEmoji').textContent = s.emoji;
    document.getElementById('taskTitle').textContent = 'Schritt '+(i+1)+': '+s.title;
    document.getElementById('taskText').textContent  = s.text;

    guide.querySelectorAll('[data-step]').forEach(g=>{
      const n = +g.dataset.step - 1;
      g.classList.toggle('show', n <= i);
      g.classList.remove('active','draw');
      if(n === i){
        g.classList.add('active');
        void g.offsetWidth;          // Animation neu starten
        g.classList.add('draw');
      }
    });

    bubbles.querySelectorAll('.bub').forEach((b,n)=>{
      b.classList.toggle('done', n < i);
      b.classList.toggle('now',  n === i);
    });

    document.getElementById('back').disabled = i === 0;
    document.getElementById('next').textContent = i === STEPS.length-1 ? 'Fertig! 🎉' : 'Weiter ▶︎';
  }

  document.getElementById('back').addEventListener('click',()=> step>0 && show(step-1));
  document.getElementById('next').addEventListener('click',()=>{
    if(step < STEPS.length-1) show(step+1);
    else cheer.classList.add('on');
  });
  document.getElementById('again').addEventListener('click',()=>{
    cheer.classList.remove('on');
    strokes = []; redraw(); show(0);
  });

  /* ---- Zeichnen ---- */
  function resize(){
    const r = pad.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    pad.width  = Math.round(r.width  * dpr);
    pad.height = Math.round(r.height * dpr);
    redraw();
  }
  function redraw(){
    ctx.clearRect(0,0,pad.width,pad.height);
    strokes.forEach(drawStroke);
  }
  function drawStroke(s){
    if(s.pts.length < 2) {
      ctx.beginPath();
      ctx.fillStyle = s.color;
      ctx.arc(s.pts[0].x*pad.width, s.pts[0].y*pad.height, s.w*pad.width/2, 0, Math.PI*2);
      ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.w * pad.width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    s.pts.forEach((p,i)=>{
      const x = p.x*pad.width, y = p.y*pad.height;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.stroke();
  }
  function pos(e){
    const r = pad.getBoundingClientRect();
    return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height};
  }
  pad.addEventListener('pointerdown', e=>{
    pad.setPointerCapture(e.pointerId);
    current = {color:color, w:0.012, pts:[pos(e)]};
    strokes.push(current);
    redraw();
  });
  pad.addEventListener('pointermove', e=>{
    if(!current) return;
    current.pts.push(pos(e));
    redraw();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>
    pad.addEventListener(ev, ()=>{ current = null; }));

  document.getElementById('undo').addEventListener('click',()=>{ strokes.pop(); redraw(); });
  document.getElementById('clear').addEventListener('click',()=>{ strokes = []; redraw(); });

  const tg = document.getElementById('toggleGuide');
  tg.addEventListener('click',()=>{
    const off = guide.classList.toggle('hidden');
    tg.textContent = off ? '👀 Vorlage an' : '👀 Vorlage aus';
  });

  document.getElementById('save').addEventListener('click',()=>{
    const out = document.createElement('canvas');
    out.width = pad.width; out.height = pad.height;
    const o = out.getContext('2d');
    o.fillStyle = '#fff'; o.fillRect(0,0,out.width,out.height);
    o.drawImage(pad,0,0);
    const a = document.createElement('a');
    a.download = 'mein-fisch.png';
    a.href = out.toDataURL('image/png');
    a.click();
  });

  window.addEventListener('resize', resize);
  resize();
  show(0);
})();
</script>
</body>
</html>
