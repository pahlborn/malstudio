<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sommer am Meer – Schritt für Schritt malen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#073B4C; --sea:#118AB2; --foam:#E9F7FC; --sand:#FFD166;
    --coral:#FF6B5B; --kelp:#06D6A0; --ghost:#C6E6F1; --paper:#FFFFFF;
    --font:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    font-family:var(--font);color:var(--deep);
    background:radial-gradient(120% 70% at 50% 0%,#FFFFFF 0%,var(--foam) 45%,#CFEAF5 100%);
    display:flex;justify-content:center;overscroll-behavior:none;
  }
  .app{width:100%;max-width:1200px;height:100%;padding:10px;display:flex;flex-direction:column;gap:10px}
  h1{font-size:clamp(19px,3.2vw,27px);font-weight:800;margin:0;letter-spacing:-.4px}
  h1 span{color:var(--sea)}

  /* ---------- Startseite ---------- */
  #home{display:flex;flex-direction:column;gap:8px;height:100%;min-height:0}
  .hint{margin:0;font-weight:500;opacity:.75;font-size:15px}
  .picker{
    flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
    gap:10px;align-content:start;padding:4px 2px 8px;
  }
  .tile{
    background:var(--paper);border:3px solid var(--deep);border-radius:18px;
    box-shadow:0 4px 0 var(--deep);padding:12px 6px;cursor:pointer;
    font-family:var(--font);font-weight:700;font-size:15px;color:var(--deep);
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .tile em{font-size:34px;font-style:normal;line-height:1}
  .tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
  .tile:focus-visible{outline:3px solid var(--sea);outline-offset:3px}

  /* ---------- Malansicht ---------- */
  #draw{display:flex;flex-direction:column;gap:9px;height:100%;min-height:0}
  #draw[hidden],#home[hidden]{display:none}
  header{display:flex;align-items:center;gap:9px;flex-wrap:nowrap}
  header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bubbles{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .bub{
    width:28px;height:28px;border-radius:50%;border:3px solid var(--ghost);
    background:var(--paper);color:var(--sea);font-family:var(--font);font-weight:700;font-size:13px;
    display:grid;place-items:center;cursor:pointer;padding:0;
    transition:transform .2s,background .2s,border-color .2s,color .2s;
  }
  .bub.done{background:var(--kelp);border-color:var(--kelp);color:#fff}
  .bub.now{background:var(--coral);border-color:var(--coral);color:#fff;transform:translateY(-3px) scale(1.15)}
  .bub:focus-visible{outline:3px solid var(--deep);outline-offset:2px}

  .task{
    background:var(--paper);border:3px solid var(--deep);border-radius:16px;
    padding:8px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 var(--deep);flex:none;
  }
  .task .emoji{font-size:30px;line-height:1}
  .task h2{margin:0;font-size:clamp(16px,2.4vw,21px);font-weight:800}
  .task p{margin:1px 0 0;font-size:clamp(13px,2vw,16px);font-weight:500;opacity:.8}

  .stage{flex:1;min-height:0;display:flex;gap:10px}
  .board{
    flex:1;min-width:0;min-height:0;position:relative;background:var(--paper);
    border:3px solid var(--deep);border-radius:20px;box-shadow:0 5px 0 var(--deep);
    overflow:hidden;touch-action:none;
  }
  .board.party{animation:party 1.6s ease 2}
  @keyframes party{
    0%,100%{border-color:var(--deep);box-shadow:0 5px 0 var(--deep)}
    50%{border-color:var(--kelp);box-shadow:0 5px 0 var(--kelp),0 0 0 8px rgba(6,214,160,.25)}
  }
  .board svg,.board canvas{position:absolute;inset:0;width:100%;height:100%}
  #guide{transition:opacity .3s}
  #guide.hidden{opacity:0}
  #guide g{display:none}
  #guide g.show{display:block}
  #guide path,#guide circle{fill:none;stroke:var(--ghost);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  #guide g.active path,#guide g.active circle{stroke:var(--coral);stroke-width:7;stroke-dasharray:100}
  #guide g.active.draw path,#guide g.active.draw circle{animation:trace 1.2s ease forwards}
  @keyframes trace{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){
    #guide g.active.draw path,#guide g.active.draw circle{animation:none}
    .bub{transition:none}.board.party{animation:none}
  }

  /* ---------- Seitenleiste mit allen Schaltern ---------- */
  .side{width:236px;flex:none;display:flex;flex-direction:column;gap:8px}
  .colors{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;justify-items:center}
  .swatch{
    width:36px;height:36px;border-radius:50%;border:3px solid var(--paper);
    box-shadow:0 0 0 3px var(--deep);cursor:pointer;padding:0;transition:transform .15s;
  }
  .swatch[aria-pressed="true"]{transform:scale(1.22)}
  .swatch:focus-visible{outline:3px solid var(--deep);outline-offset:6px}
  .sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .size{
    height:44px;border-radius:13px;border:3px solid var(--deep);background:var(--paper);
    cursor:pointer;padding:0;display:grid;place-items:center;box-shadow:0 3px 0 var(--deep);
  }
  .size i{display:block;border-radius:50%;background:var(--deep)}
  .size[aria-pressed="true"]{background:var(--sand)}
  .size:active{transform:translateY(2px);box-shadow:0 1px 0 var(--deep)}
  .size:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
  .icon-btn{
    height:42px;padding:0 10px;border-radius:13px;border:3px solid var(--deep);
    background:var(--paper);color:var(--deep);font-family:var(--font);font-weight:700;font-size:15px;
    cursor:pointer;box-shadow:0 3px 0 var(--deep);white-space:nowrap;
  }
  .icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--deep)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .nav-btn{
    height:56px;border-radius:16px;border:3px solid var(--deep);
    font-family:var(--font);font-weight:800;font-size:17px;
    background:var(--sand);color:var(--deep);cursor:pointer;box-shadow:0 4px 0 var(--deep);
  }
  .nav-btn.primary{background:var(--kelp)}
  .nav-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
  .nav-btn:disabled{opacity:.35;transform:none;cursor:default}
  .nav-btn:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
  .spacer{flex:1}

  /* Fertig-Leiste: schmal, verdeckt das Bild nicht */
  .done-bar{
    display:none;align-items:center;gap:8px;flex-wrap:wrap;
    background:var(--kelp);border:3px solid var(--deep);border-radius:16px;
    padding:8px 10px;box-shadow:0 4px 0 var(--deep);
  }
  .done-bar.on{display:flex}
  .done-bar strong{font-size:16px}
  .done-bar .icon-btn{height:38px;font-size:14px}

  /* ---------- Hochformat: Schalter unter das Bild ---------- */
  @media (orientation:portrait){
    .stage{flex-direction:column}
    .side{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center}
    .colors{grid-template-columns:repeat(8,auto);gap:6px}
    .sizes{grid-template-columns:repeat(4,58px)}
    .grid2{grid-template-columns:repeat(4,auto)}
    .side .nav-btn{flex:1;min-width:130px;height:50px}
    .spacer{display:none}
  }
</style>
</head>
<body>
<div class="app">

  <section id="home">
    <h1>Was malen wir <span>heute</span>?</h1>
    <p class="hint">Motiv antippen – dann geht es Schritt für Schritt los.</p>
    <div class="picker" id="picker"></div>
  </section>

  <section id="draw" hidden>
    <header>
      <button class="icon-btn" id="home-btn">◀︎ Motive</button>
      <h1 id="motifName"></h1>
      <div class="bubbles" id="bubbles"></div>
    </header>

    <div class="task">
      <div class="emoji" id="taskEmoji">✏️</div>
      <div>
        <h2 id="taskTitle"></h2>
        <p id="taskText"></p>
      </div>
    </div>

    <div class="done-bar" id="doneBar">
      <strong>🎉 Fertig! Dein Bild ist toll geworden.</strong>
      <button class="icon-btn" id="saveDone">💾 Speichern</button>
      <button class="icon-btn" id="again">↻ Noch einmal</button>
      <button class="icon-btn" id="other">🖼️ Anderes Motiv</button>
    </div>

    <div class="stage">
      <div class="board" id="board">
        <svg id="guide" viewBox="0 0 800 600" aria-hidden="true"></svg>
        <canvas id="pad"></canvas>
      </div>

      <div class="side">
        <div class="colors" id="colors"></div>
        <div class="sizes" id="sizes"></div>
        <div class="grid2">
          <button class="icon-btn" id="undo">↩︎ Zurück</button>
          <button class="icon-btn" id="clear">🧽 Löschen</button>
          <button class="icon-btn" id="toggleGuide">👀 Vorlage</button>
          <button class="icon-btn" id="musicBtn">🎵 Musik</button>
        </div>
        <button class="icon-btn" id="save">💾 Bild speichern</button>
        <div class="spacer"></div>
        <button class="nav-btn" id="back">◀︎ Schritt zurück</button>
        <button class="nav-btn primary" id="next">Weiter ▶︎</button>
      </div>
    </div>
  </section>
</div>

/* ============================================================
   MUSIK – leichte Bossa, komplett im Browser erzeugt
   ============================================================ */
const Music=(function(){
  let ac=null,master=null,timer=null,noiseBuf=null,bar=0,slot=0,nextTime=0,on=true;
  const BPM=88,EIGHTH=60/88/2,LOOK=0.15;
  const CHORDS=[{bass:41,notes:[57,60,64]},{bass:38,notes:[57,60,65]},
                {bass:43,notes:[58,62,65]},{bass:36,notes:[58,64,67]}];
  const MELODY=[72,74,77,69,81,76];
  const f=m=>440*Math.pow(2,(m-69)/12);

  function init(){
    if(ac) return;
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain(); master.gain.value=0.085; master.connect(ac.destination);
    const len=ac.sampleRate*2;
    noiseBuf=ac.createBuffer(1,len,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const surf=ac.createBufferSource(); surf.buffer=noiseBuf; surf.loop=true;
    const sf=ac.createBiquadFilter(); sf.type='lowpass'; sf.frequency.value=420;
    const sg=ac.createGain(); sg.gain.value=0.02;
    const lfo=ac.createOscillator(); lfo.frequency.value=0.13;
    const lg=ac.createGain(); lg.gain.value=0.012;
    lfo.connect(lg); lg.connect(sg.gain);
    surf.connect(sf); sf.connect(sg); sg.connect(master);
    surf.start(); lfo.start();
  }
  function pluck(t,freq,dur,vol,type,cut){
    const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();
    o.type=type||'triangle'; o.frequency.value=freq;
    fl.type='lowpass'; fl.frequency.value=cut||2200;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(fl); fl.connect(g); g.connect(master);
    o.start(t); o.stop(t+dur+0.05);
  }
  function shaker(t,vol){
    const s=ac.createBufferSource(); s.buffer=noiseBuf;
    const fl=ac.createBiquadFilter(); fl.type='highpass'; fl.frequency.value=6000;
    const g=ac.createGain();
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    s.connect(fl); fl.connect(g); g.connect(master);
    s.start(t); s.stop(t+0.1);
  }
  function tick(){
    while(nextTime<ac.currentTime+LOOK){
      const ch=CHORDS[bar%CHORDS.length],t=nextTime;
      if(slot===0) pluck(t,f(ch.bass),0.9,0.16,'sine',600);
      if(slot===4) pluck(t,f(ch.bass+7),0.8,0.12,'sine',600);
      if(slot===0||slot===3||slot===6){
        const v=slot===0?0.075:0.055;
        ch.notes.forEach((n,i)=>pluck(t+i*0.012,f(n),0.75,v,'triangle',1800));
      }
      shaker(t, slot%2?0.018:0.030);
      if(bar%2===1 && slot===2 && Math.random()<0.7)
        pluck(t,f(MELODY[Math.floor(Math.random()*MELODY.length)]),1.1,0.05,'sine',3000);
      nextTime+=EIGHTH;
      if(++slot>7){slot=0;bar++;}
    }
  }
  return {
    start(){ if(!on) return; init(); if(ac.state==='suspended') ac.resume();
      if(timer) return; nextTime=ac.currentTime+0.1; slot=0; timer=setInterval(tick,25); },
    stop(){ if(timer){clearInterval(timer);timer=null;} },
    toggle(){ on=!on; on?this.start():this.stop(); return on; }
  };
})();

/* ============================================================

   ============================================================ */
const home=document.getElementById('home'), draw=document.getElementById('draw');
const guide=document.getElementById('guide'), bubbles=document.getElementById('bubbles');
const board=document.getElementById('board'), pad=document.getElementById('pad'), ctx=pad.getContext('2d');
const doneBar=document.getElementById('doneBar'), tg=document.getElementById('toggleGuide');

let motif=null, step=0, color=COLORS[0], width=SIZES[1], strokes=[], current=null;

/* ---------- Startseite ---------- */
const picker=document.getElementById('picker');
MOTIFS.forEach((m,i)=>{
  const b=document.createElement('button');
  b.className='tile';
  b.innerHTML='<em>'+m.emoji+'</em>'+m.name;
  b.addEventListener('click',()=>openMotif(i));
  picker.appendChild(b);
});

function openMotif(i){
  motif=MOTIFS[i];
  document.getElementById('motifName').textContent=motif.emoji+' '+motif.name;
  strokes=[]; buildGuide(); buildBubbles();
  doneBar.classList.remove('on'); board.classList.remove('party');
  guide.classList.remove('hidden'); tg.textContent='👀 Vorlage';
  home.hidden=true; draw.hidden=false;
  Music.start();
  requestAnimationFrame(()=>{ resize(); show(0); });
}
function goHome(){
  draw.hidden=true; home.hidden=false;
  doneBar.classList.remove('on'); board.classList.remove('party');
}
document.getElementById('home-btn').addEventListener('click',goHome);
document.getElementById('other').addEventListener('click',goHome);

/* ---------- Vorlage ---------- */
function buildGuide(){
  guide.textContent='';
  motif.steps.forEach(st=>{
    const g=document.createElementNS(NS,'g');
    st.shapes.forEach(sh=>{
      let el;
      if(Array.isArray(sh)){
        el=document.createElementNS(NS,'circle');
        el.setAttribute('cx',sh[0]); el.setAttribute('cy',sh[1]); el.setAttribute('r',sh[2]);
      }else{
        el=document.createElementNS(NS,'path');
        el.setAttribute('d',sh);
      }
      el.setAttribute('pathLength','100');
      g.appendChild(el);
    });
    guide.appendChild(g);
  });
}
function buildBubbles(){
  bubbles.textContent='';
  motif.steps.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='bub'; b.textContent=i+1;
    b.setAttribute('aria-label','Schritt '+(i+1)+': '+s.title);
    b.addEventListener('click',()=>{ doneBar.classList.remove('on'); show(i); });
    bubbles.appendChild(b);
  });
}

function show(i){
  step=i;
  const s=motif.steps[i];
  document.getElementById('taskEmoji').textContent=s.emoji;
  document.getElementById('taskTitle').textContent='Schritt '+(i+1)+': '+s.title;
  document.getElementById('taskText').textContent=s.text;

  [...guide.children].forEach((g,n)=>{
    g.classList.toggle('show',n<=i);
    g.classList.remove('active','draw');
    [...g.children].forEach(el=>el.style.animationDelay='');
    if(n===i){
      g.classList.add('active');
      [...g.children].forEach((el,k)=>el.style.animationDelay=(k*0.3)+'s');
      void g.getBoundingClientRect();
      g.classList.add('draw');
    }
  });
  [...bubbles.children].forEach((b,n)=>{
    b.classList.toggle('done',n<i);
    b.classList.toggle('now',n===i);
  });

  document.getElementById('back').disabled=i===0;
  document.getElementById('next').textContent = i===motif.steps.length-1 ? 'Fertig! 🎉' : 'Weiter ▶︎';
}

document.getElementById('back').addEventListener('click',()=>{
  doneBar.classList.remove('on');
  if(step>0) show(step-1);
});
document.getElementById('next').addEventListener('click',()=>{
  if(step<motif.steps.length-1){ doneBar.classList.remove('on'); show(step+1); }
  else finish();
});
function finish(){
  // Vorlage ausblenden: das fertige Bild bleibt allein und ganz sichtbar
  guide.classList.add('hidden'); tg.textContent='👀 Vorlage an';
  board.classList.remove('party'); void board.offsetWidth; board.classList.add('party');
  doneBar.classList.add('on');
  [...bubbles.children].forEach(b=>{b.classList.remove('now');b.classList.add('done');});
}
document.getElementById('again').addEventListener('click',()=>{
  doneBar.classList.remove('on'); board.classList.remove('party');
  guide.classList.remove('hidden'); tg.textContent='👀 Vorlage';
  strokes=[]; redraw(); show(0);
});

/* ---------- Farben ---------- */
const colorsBox=document.getElementById('colors');
COLORS.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='swatch'; b.style.background=c;
  b.setAttribute('aria-label','Farbe '+(i+1));
  b.setAttribute('aria-pressed',i===0?'true':'false');
  b.addEventListener('click',()=>{
    color=c;
    colorsBox.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
  });
  colorsBox.appendChild(b);
});

/* ---------- Stiftdicken ---------- */
const sizesBox=document.getElementById('sizes');
SIZES.forEach((s,i)=>{
  const b=document.createElement('button');
  b.className='size';
  b.setAttribute('aria-label','Stiftdicke '+(i+1));
  b.setAttribute('aria-pressed', i===1?'true':'false');
  const dot=document.createElement('i');
  const px=8+i*7;
  dot.style.width=px+'px'; dot.style.height=px+'px';
  b.appendChild(dot);
  b.addEventListener('click',()=>{
    width=s;
    sizesBox.querySelectorAll('.size').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
  });
  sizesBox.appendChild(b);
});

/* ---------- Zeichnen ---------- */
function resize(){
  const r=pad.getBoundingClientRect();
  if(!r.width||!r.height) return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  pad.width=Math.round(r.width*dpr); pad.height=Math.round(r.height*dpr);
  redraw();
}
function redraw(){
  ctx.clearRect(0,0,pad.width,pad.height);
  strokes.forEach(drawStroke);
}
function drawStroke(s){
  const w=s.w*Math.min(pad.width,pad.height);
  if(s.pts.length<2){
    ctx.beginPath(); ctx.fillStyle=s.color;
    ctx.arc(s.pts[0].x*pad.width,s.pts[0].y*pad.height,w/2,0,Math.PI*2); ctx.fill(); return;
  }
  ctx.beginPath(); ctx.strokeStyle=s.color; ctx.lineWidth=w;
  ctx.lineCap='round'; ctx.lineJoin='round';
  s.pts.forEach((p,i)=>{
    const x=p.x*pad.width,y=p.y*pad.height;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.stroke();
}
function pos(e){
  const r=pad.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};
}
pad.addEventListener('pointerdown',e=>{
  pad.setPointerCapture(e.pointerId);
  current={color:color,w:width,pts:[pos(e)]};
  strokes.push(current); redraw();
});
pad.addEventListener('pointermove',e=>{ if(current){ current.pts.push(pos(e)); redraw(); } });
['pointerup','pointercancel','pointerleave'].forEach(ev=>
  pad.addEventListener(ev,()=>{current=null;}));

document.getElementById('undo').addEventListener('click',()=>{strokes.pop();redraw();});
document.getElementById('clear').addEventListener('click',()=>{strokes=[];redraw();});
tg.addEventListener('click',()=>{
  const off=guide.classList.toggle('hidden');
  tg.textContent = off ? '👀 Vorlage an' : '👀 Vorlage';
});
const mb=document.getElementById('musicBtn');
mb.addEventListener('click',()=>{ mb.textContent = Music.toggle() ? '🎵 Musik' : '🔇 Musik aus'; });

function save(){
  const out=document.createElement('canvas');
  out.width=pad.width; out.height=pad.height;
  const o=out.getContext('2d');
  o.fillStyle='#fff'; o.fillRect(0,0,out.width,out.height);
  o.drawImage(pad,0,0);
  const a=document.createElement('a');
  a.download='mein-bild.png'; a.href=out.toDataURL('image/png'); a.click();
}
document.getElementById('save').addEventListener('click',save);
document.getElementById('saveDone').addEventListener('click',save);

if(window.ResizeObserver) new ResizeObserver(resize).observe(board);
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,300));
})();
</script>
